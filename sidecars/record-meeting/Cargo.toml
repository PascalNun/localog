[package]
name = "localog-record-meeting"
version = "0.0.0"
publish = false
license = "GPL-3.0-or-later"
edition = "2024"

# WASAPI loopback on Windows. ALSA's device list does not expose PipeWire/PulseAudio
# monitor sources, so Linux talks to the desktop sound server directly.
[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = "2.30"

[[bin]]
name = "localog-record-meeting"
path = "src/main.rs"

[profile.release]
opt-level = 3
strip = true
