[package]
name = "localog-storage-recovery-spike"
version = "0.0.0"
publish = false
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[dev-dependencies]
tempfile = "3.27.0"

[[example]]
name = "measure"
path = "examples/measure.rs"
