name: Linux build

# Manual, and on a version tag. Not on every push: this compiles whisper, sherpa
# and FFmpeg from source, which is tens of minutes even with the cache warm.
on:
  workflow_dispatch:
    inputs:
      flatpak:
        description: Build the experimental Flatpak bundle as well
        type: boolean
        default: false
  push:
    tags: ['v*']

jobs:
  build:
    # Both architectures, and neither is a cross-compile: every sidecar takes its
    # target from `rustc -vV`, so the same scripts produce an arm64 build when run
    # on an arm64 machine. FFmpeg, whisper, llama.cpp and sherpa are all built from
    # source here, which is what makes that true — nothing downloads a prebuilt
    # x86 binary that would have to be replaced.
    #
    # Not ubuntu-latest, deliberately. A binary cannot run against an older glibc
    # than it was linked with, and latest (24.04) links 2.39 — which rules out
    # Debian 12, Ubuntu 22.04 and RHEL 9, a large part of installed Linux. Building
    # on the older base costs nothing and the result runs on everything newer.
    strategy:
      # One architecture failing must not cancel the other. They share no code
      # path beyond these scripts, so a break in one says nothing about the other.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # What Tauri v2 needs to build a GTK/WebKit application. libwebkit2gtk-4.1
      # is the v2 one; 4.0 is Tauri v1 and silently gives a configure failure.
      #
      # The Linux recorder uses libpulse directly, including on PipeWire-Pulse.
      # ALSA's device list does not expose the sound server's monitor sources.
      - name: Install the desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev build-essential curl wget file libssl-dev \
            cmake ninja-build pkg-config \
            libopus-dev nasm libarchive-tools desktop-file-utils \
            libasound2-dev libpulse-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      # The FFmpeg sidecar links libopus statically on purpose, so the binary
      # carries no dependency on the machine that built it. Prove the archive is
      # actually there before spending twenty minutes finding out it is not.
      - name: Check for a static libopus
        run: |
          archive="$(pkg-config --variable=libdir opus)/libopus.a"
          test -f "$archive" && ls -lh "$archive"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # The sidecar sources are the expensive part, not the Rust crate.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            vendor
          # The runner image is in the key, not just the lockfile. Without it a
          # target directory built on 24.04 was restored onto 22.04 and the
          # compile failed with "can't find crate for tauri" — an error that says
          # nothing about the actual cause, which was a different toolchain's
          # artifacts sitting in the same directory.
          # The architecture is in the key for the same reason the image is: an
          # x86 target directory restored onto an arm runner is a slower version
          # of the same confusing failure.
          key: linux-2204-${{ matrix.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'scripts/build-*-sidecar.sh') }}
          restore-keys: linux-2204-${{ matrix.arch }}-

      - run: npm ci

      # Split deliberately. These need no Rust and no sidecars, so a lint or a
      # typecheck failure is known in a minute rather than after the compile.
      - name: Check the front end
        run: |
          npm run lint
          npm run check
          npm test

      # Sidecars are release inputs. The bundle config is explicitly passed only
      # below, so ordinary development and Rust tests also work without them.
      - name: Check Linux packaging inputs
        run: python3 scripts/test-linux-packaging.py

      - name: Check the Rust side
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          cargo test --locked --manifest-path sidecars/record-meeting/Cargo.toml

      - name: Build the sidecars
        run: npm run build:sidecar

      # Named so a failure here is obviously the bundle rather than the compile.
      - name: Bundle the application
        run: npx tauri build --config src-tauri/tauri.linux-bundle.conf.json

      # Experimental until the sandbox workflow is exercised on real desktops.
      # Reuse the complete sidecar-bearing Debian build, rather than recompiling
      # Rust/Node and seven toolchains inside a second build environment.
      - name: Build an experimental Flatpak
        if: github.event_name == 'workflow_dispatch' && inputs.flatpak
        run: |
          sudo apt-get install -y flatpak flatpak-builder libarchive-tools appstream
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49
          mapfile -t packages < <(find src-tauri/target/release/bundle/deb -name '*.deb' -type f)
          test "${#packages[@]}" -eq 1
          staging="$RUNNER_TEMP/localog-flatpak"
          python3 scripts/prepare-flatpak.py "${packages[0]}" "$staging"
          appstreamcli validate --no-net "$staging/io.github.PascalNun.LocaLog.metainfo.xml"
          flatpak-builder --user --force-clean --repo="$RUNNER_TEMP/localog-flatpak-repo" \
            "$RUNNER_TEMP/localog-flatpak-build" "$staging/io.github.PascalNun.LocaLog.json"
          mkdir -p src-tauri/target/release/bundle/flatpak
          flatpak build-bundle "$RUNNER_TEMP/localog-flatpak-repo" \
            "src-tauri/target/release/bundle/flatpak/LocaLog_${{ matrix.arch }}.flatpak" \
            io.github.PascalNun.LocaLog --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: What came out
        if: always()
        run: |
          find src-tauri/target/release/bundle -maxdepth 2 -type f \
            \( -name '*.deb' -o -name '*.AppImage' \) -exec ls -lh {} \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: localog-linux-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/flatpak/*.flatpak
          if-no-files-found: warn
