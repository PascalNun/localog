[package]
name = "localog"
version = "0.0.1"
description = "Local-first AI for creating meeting protocols"
authors = ["LocaLog contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "localog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3.27.0"
