[package]
name = "localog"
version = "0.0.1"
description = "Local-first AI for creating meeting protocols"
authors = ["LocaLog contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.97.1"

# macOS 27 rejects some stripped procedural-macro dylibs produced by the pinned
# Rust toolchain (rust-lang/rust#157750). Keep build-time libraries loadable.
[profile.release.build-override]
strip = "none"

[lib]
name = "localog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
libc = "0.2"
# Linux PDF saving uses the platform handle exposed by Tauri 2.11.
tauri = { version = "~2.11", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.2"
# rustls is required to verify model downloads over HTTPS. The loopback provider
# path still uses plain HTTP; TLS exists here only for fetching models.
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v7"] }
tiny_http = "0.12"
tempfile = "3.27.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "2.0.2"
