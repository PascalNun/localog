[package]
name = "localog"
version = "0.0.1"
description = "Local-first meeting protocols"
authors = ["LocaLog contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "localog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
